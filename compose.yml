services:
  market-bots:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.local
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - market-bots-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  market-bots-data:
